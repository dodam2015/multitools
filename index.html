            { id: 'melbourne', name: '멜버른', country: '호주', lat: -37.8136, lng: 144.9631, tz: 'Australia/Melbourne' },
            { id: 'auckland', name: '오클랜드', country: '뉴질랜드', lat: -36.8485, lng: 174.7633, tz: 'Pacific/Auckland' }
        ];

        const yearHolidaysCache = {};

        function getHolidaysForYear(year) {
            const holidays = {};
            const toKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

            const addHoliday = (d, name) => {
                const key = toKey(d);
                if (!holidays[key]) holidays[key] = name;
            };

            const altEligible = [];

            // 1. Fixed Solar Holidays (양력 고정 공휴일)
            const solarFixed = [
                { m: 1, d: 1, name: "신정", alt: false },
                { m: 3, d: 1, name: "삼일절", alt: true },
                { m: 5, d: 5, name: "어린이날", alt: true },
                { m: 6, d: 6, name: "현충일", alt: false },
                { m: 8, d: 15, name: "광복절", alt: true },
                { m: 10, d: 3, name: "개천절", alt: true },
                { m: 10, d: 9, name: "한글날", alt: true },
                { m: 12, d: 25, name: "성탄절", alt: true }
            ];

            solarFixed.forEach(h => {
                const date = new Date(year, h.m - 1, h.d);
                addHoliday(date, h.name);
                if (h.alt) altEligible.push({ date, name: h.name });
            });

            // 2. Dynamic Lunar Holiday Calculation using Intl Chinese Calendar
            const findLunarDate = (startMonth, endMonth, targetMonth, targetDay) => {
                try {
                    const formatter = new Intl.DateTimeFormat('ko-KR-u-ca-chinese', { month: 'numeric', day: 'numeric' });
                    for (let m = startMonth - 1; m <= endMonth - 1; m++) {
                        const maxD = new Date(year, m + 1, 0).getDate();
                        for (let d = 1; d <= maxD; d++) {
                            const date = new Date(year, m, d);
                            const parts = formatter.formatToParts(date);
                            let lMonth = 0, lDay = 0;
                            for (const p of parts) {
                                if (p.type === 'month') lMonth = parseInt(p.value, 10);
                                if (p.type === 'day') lDay = parseInt(p.value, 10);
                            }
                            if (lMonth === targetMonth && lDay === targetDay) return date;
                        }
                    }
                } catch (e) {}
                return null;
            };

            let seollal = findLunarDate(1, 2, 1, 1);
            let buddha = findLunarDate(4, 6, 4, 8);
            let chuseok = findLunarDate(8, 10, 8, 15);

            // Precision Lunar Table Fallback (2020 ~ 2030)
            const lunarFallback = {
                2024: { seollal: "2024-02-10", buddha: "2024-05-15", chuseok: "2024-09-17" },
                2025: { seollal: "2025-01-29", buddha: "2025-05-05", chuseok: "2025-10-06" },
                2026: { seollal: "2026-02-17", buddha: "2026-05-24", chuseok: "2026-09-25" },
                2027: { seollal: "2027-02-06", buddha: "2027-05-13", chuseok: "2027-09-15" },
                2028: { seollal: "2028-01-26", buddha: "2028-05-02", chuseok: "2028-10-03" },
                2029: { seollal: "2029-02-13", buddha: "2029-05-20", chuseok: "2029-09-22" },
                2030: { seollal: "2030-02-03", buddha: "2030-05-09", chuseok: "2030-09-12" }
            };

            if (!seollal && lunarFallback[year]) seollal = new Date(lunarFallback[year].seollal);
            if (!buddha && lunarFallback[year]) buddha = new Date(lunarFallback[year].buddha);
            if (!chuseok && lunarFallback[year]) chuseok = new Date(lunarFallback[year].chuseok);

            if (seollal) {
                const prev = new Date(seollal); prev.setDate(prev.getDate() - 1);
                const next = new Date(seollal); next.setDate(next.getDate() + 1);
                addHoliday(prev, "설날 연휴");
                addHoliday(seollal, "설날");
                addHoliday(next, "설날 연휴");
                altEligible.push({ date: prev, name: "설날 연휴" }, { date: seollal, name: "설날" }, { date: next, name: "설날 연휴" });
            }

            if (buddha) {
                addHoliday(buddha, "부처님오신날");
                altEligible.push({ date: buddha, name: "부처님오신날" });
            }

            if (chuseok) {
                const prev = new Date(chuseok); prev.setDate(prev.getDate() - 1);
                const next = new Date(chuseok); next.setDate(next.getDate() + 1);
                addHoliday(prev, "추석 연휴");
                addHoliday(chuseok, "추석");
                addHoliday(next, "추석 연휴");
                altEligible.push({ date: prev, name: "추석 연휴" }, { date: chuseok, name: "추석" }, { date: next, name: "추석 연휴" });
            }

            // 3. Substitute Holidays Calculation (대체공휴일)
            altEligible.forEach(item => {
                const dayOfWeek = item.date.getDay();
                const isMulti = item.name.includes("설날") || item.name.includes("추석");
                const needsAlt = isMulti ? (dayOfWeek === 0) : (dayOfWeek === 0 || dayOfWeek === 6);

                if (needsAlt) {
                    let altDate = new Date(item.date);
                    altDate.setDate(altDate.getDate() + 1);
                    while (altDate.getDay() === 0 || altDate.getDay() === 6 || holidays[toKey(altDate)]) {
                        altDate.setDate(altDate.getDate() + 1);
                    }
                    addHoliday(altDate, "대체휴일");
                }
            });

            return holidays;
        }

        function getHolidays(year) {
            if (!yearHolidaysCache[year]) {
                yearHolidaysCache[year] = getHolidaysForYear(year);
            }
            return yearHolidaysCache[year];
        }

        const formatDate = (d) => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : null;

        function LocalClock({ showSeconds }) {
            const [time, setTime] = React.useState(new Date());
            React.useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const hours = String(time.getHours()).padStart(2, '0');
            const minutes = String(time.getMinutes()).padStart(2, '0');
            const seconds = String(time.getSeconds()).padStart(2, '0');

            return (
                <div className="flex flex-col items-center justify-center h-full w-full p-6">
                    <div className="text-center space-y-6 max-w-xl">
                        <div className="text-xs md:text-sm font-semibold text-gray-400 tracking-[0.25em] uppercase">
                            {time.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' })}
                        </div>
                        <div className="text-6xl sm:text-8xl md:text-9xl font-light tabular-nums tracking-tight text-neutral-900 flex items-baseline justify-center">
                            <span>{hours}:{minutes}</span>
                            {showSeconds && (
                                <span className="text-2xl sm:text-4xl md:text-5xl text-gray-400 ml-2 font-normal animate-pulse">
                                    :{seconds}
                                </span>
                            )}
                        </div>
                        <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-neutral-100 text-xs font-medium text-neutral-500">
                            <i className="ph ph-map-pin"></i> 현지 시간 (KST 기준)
                        </div>
                    </div>
                </div>
            )
        }

        function Calculator() {
            const [display, setDisplay] = React.useState('0');
            const [equation, setEquation] = React.useState('');
            const [prevValue, setPrevValue] = React.useState(null);
            const [operator, setOperator] = React.useState(null);
            const [waitingForNewValue, setWaitingForNewValue] = React.useState(false);

            const calculate = (a, b, op) => {
                const num1 = parseFloat(a);
                const num2 = parseFloat(b);
                if (isNaN(num1) || isNaN(num2)) return b;
                switch (op) {
                    case '+': return (num1 + num2).toString();
                    case '-': return (num1 - num2).toString();
                    case '×': return (num1 * num2).toString();
                    case '÷': return num2 === 0 ? 'Error' : (num1 / num2).toString();
                    default: return b;
                }
            };

            const handleNum = (num) => {
                if (waitingForNewValue) {
                    setDisplay(num);
                    setWaitingForNewValue(false);
                } else {
                    setDisplay(display === '0' ? num : display + num);
                }
            };

            const handleOp = (op) => {
                if (operator && !waitingForNewValue) {
                    const result = calculate(prevValue, display, operator);
                    setDisplay(result);
                    setPrevValue(result);
                    setEquation(`${result} ${op}`);
                } else {
                    setPrevValue(display);
                    setEquation(`${display} ${op}`);
                }
                setOperator(op);
                setWaitingForNewValue(true);
            };

            const handleEqual = () => {
                if (!operator || waitingForNewValue) return;
                const result = calculate(prevValue, display, operator);
                setDisplay(result);
                setEquation('');
                setPrevValue(null);
                setOperator(null);
                setWaitingForNewValue(true);
            };

            const handleClear = () => {
                setDisplay('0');
                setEquation('');
                setPrevValue(null);
                setOperator(null);
                setWaitingForNewValue(false);
            };

            const btns = [
                ['C', '±', '%', '÷'],
                ['7', '8', '9', '×'],
                ['4', '5', '6', '-'],
                ['1', '2', '3', '+'],
                ['0', '.', '=']
            ];

            return (
                <div className="flex items-center justify-center h-full w-full p-4">
                    <div className="w-full max-w-sm border border-neutral-200/80 rounded-3xl p-6 bg-white shadow-xl shadow-neutral-100">
                        <div className="text-right h-24 flex flex-col justify-end mb-6">
                            <div className="text-gray-400 text-sm h-6">{equation}</div>
                            <div className="text-5xl font-light tracking-tight tabular-nums overflow-hidden text-ellipsis whitespace-nowrap">{display}</div>
                        </div>
                        <div className="grid gap-3">
                            {btns.map((row, i) => (
                                <div key={i} className={`grid ${row.length === 3 ? 'grid-cols-[2fr_1fr_1fr]' : 'grid-cols-4'} gap-3`}>
                                    {row.map(btn => (
                                        <button
                                            key={btn}
                                            onClick={() => {
                                                if(btn === 'C') handleClear();
                                                else if(btn === '=') handleEqual();
                                                else if(['+','-','×','÷'].includes(btn)) handleOp(btn);
                                                else if(btn === '±') setDisplay((parseFloat(display) * -1).toString());
                                                else if(btn === '%') setDisplay((parseFloat(display) / 100).toString());
                                                else handleNum(btn);
                                            }}
                                            className={`h-16 rounded-2xl text-xl font-medium transition-transform active:scale-95 flex items-center justify-center
                                                ${['÷','×','-','+','='].includes(btn) ? 'bg-black text-white hover:bg-neutral-800' : 
                                                  ['C','±','%'].includes(btn) ? 'bg-neutral-100 text-neutral-800 hover:bg-neutral-200' : 
                                                  'bg-neutral-50 border border-neutral-100 text-neutral-800 hover:bg-neutral-100'}`}
                                        >
                                            {btn}
                                        </button>
                                    ))}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            )
        }

        function Timer({ showSeconds }) {
            const [mode, setMode] = React.useState('stopwatch'); // 'stopwatch' | 'timer'
            const [time, setTime] = React.useState(0);
            const [isRunning, setIsRunning] = React.useState(false);
            const [laps, setLaps] = React.useState([]);

            React.useEffect(() => {
                let interval;
                if (isRunning) {
                    interval = setInterval(() => {
                        setTime(prev => prev + 10);
                    }, 10);
                }
                return () => clearInterval(interval);
            }, [isRunning]);

            const formatTime = (ms) => {
                const mins = Math.floor(ms / 60000);
                const secs = Math.floor((ms % 60000) / 1000);
                const centis = Math.floor((ms % 1000) / 10);
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(centis).padStart(2, '0')}`;
            };

            const toggle = () => setIsRunning(!isRunning);
            const resetOrLap = () => {
                if (isRunning) {
                    setLaps([time, ...laps]);
                } else {
                    setTime(0);
                    setLaps([]);
                }
            };

            return (
                <div className="flex flex-col items-center h-full w-full max-w-lg mx-auto p-6 md:p-8">
                    <div className="flex bg-neutral-100 p-1 rounded-full mb-10 w-56">
                        <button onClick={() => setMode('stopwatch')} className={`flex-1 py-2 text-xs font-semibold rounded-full transition ${mode === 'stopwatch' ? 'bg-white shadow-sm text-black' : 'text-neutral-500'}`}>스톱워치</button>
                        <button onClick={() => setMode('timer')} className={`flex-1 py-2 text-xs font-semibold rounded-full transition ${mode === 'timer' ? 'bg-white shadow-sm text-black' : 'text-neutral-500'}`}>타이머</button>
                    </div>

                    <div className="text-6xl sm:text-7xl md:text-8xl font-light tabular-nums tracking-tight mb-10 text-neutral-900">
                        {formatTime(time)}
                    </div>

                    <div className="flex gap-6 w-full max-w-xs justify-center mb-8">
                        <button onClick={resetOrLap} className="w-16 h-16 rounded-full bg-neutral-100 text-neutral-700 font-medium hover:bg-neutral-200 transition active:scale-95">
                            {isRunning ? '랩' : '재설정'}
                        </button>
                        <button onClick={toggle} className={`w-16 h-16 rounded-full font-medium transition text-white active:scale-95 ${isRunning ? 'bg-rose-500 hover:bg-rose-600' : 'bg-neutral-900 hover:bg-black'}`}>
                            {isRunning ? '정지' : '시작'}
                        </button>
                    </div>

                    <div className="w-full flex-1 overflow-y-auto hide-scrollbar border-t border-neutral-100 pt-4">
                        {laps.map((lap, i) => (
                            <div key={i} className="flex justify-between py-3 border-b border-neutral-50 text-neutral-600 text-sm">
                                <span>랩 {laps.length - i}</span>
                                <span className="font-mono tabular-nums">{formatTime(lap)}</span>
                            </div>
                        ))}
                    </div>
                </div>
            )
        }

        function Weather({ showSeconds }) {
            const [status, setStatus] = React.useState('loading');
            const [data, setData] = React.useState(null);

            React.useEffect(() => {
                if (!navigator.geolocation) return setStatus('error');
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    try {
                        const { latitude, longitude } = pos.coords;
                        const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m`);
                        const wJson = await wRes.json();
                        
                        const aRes = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${latitude}&longitude=${longitude}&current=pm10,pm2_5`);
                        const aJson = await aRes.json();

                        // SunCalc for sunrise/sunset/moonrise/moonset
                        const now = new Date();
                        const sunTimes = SunCalc.getTimes(now, latitude, longitude);
                        const moonTimes = SunCalc.getMoonTimes(now, latitude, longitude);

                        const code = wJson.current.weather_code;
                        let icon = 'ph-sun', desc = '맑음';
                        if (code > 0 && code <= 3) { icon = 'ph-cloud-sun'; desc = '구름 약간'; }
                        else if (code >= 45 && code <= 48) { icon = 'ph-cloud-fog'; desc = '안개'; }
                        else if (code >= 51 && code <= 67) { icon = 'ph-cloud-rain'; desc = '비'; }
                        else if (code >= 71 && code <= 77) { icon = 'ph-snowflake'; desc = '눈'; }

                        setData({ 
                            temp: wJson.current.temperature_2m, 
                            humidity: wJson.current.relative_humidity_2m,
                            wind: wJson.current.wind_speed_10m,
                            icon, desc, 
                            pm10: aJson.current.pm10, 
                            pm25: aJson.current.pm2_5,
                            sunrise: sunTimes.sunrise,
                            sunset: sunTimes.sunset,
                            moonrise: moonTimes.rise,
                            moonset: moonTimes.set
                        });
                        setStatus('success');
                    } catch (e) { setStatus('error'); }
                }, () => setStatus('error'));
            }, []);

            const formatTimeStr = (dateObj) => {
                if (!dateObj) return '정보없음';
                const options = { 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    hour12: false 
                };
                if (showSeconds) options.second = '2-digit';
                return new Intl.DateTimeFormat('en-GB', options).format(dateObj);
            };

            if (status !== 'success') return (
                <div className="flex flex-col h-full items-center justify-center text-neutral-400 gap-3">
                    <i className="ph ph-spinner animate-spin text-3xl"></i>
                    <p className="text-sm">{status === 'loading' ? '현재 위치의 날씨 정보를 가져오는 중...' : '위치 접근 권한이 필요합니다.'}</p>
                </div>
            );

            return (
                <div className="flex flex-col h-full max-w-4xl mx-auto p-4 md:p-8 overflow-y-auto hide-scrollbar gap-8">
                    <div className="text-center pt-4">
                        <i className={`ph ${data.icon} text-7xl text-neutral-800 mb-3 inline-block`}></i>
                        <div className="text-6xl md:text-8xl font-light tracking-tight text-neutral-900">{Math.round(data.temp)}°C</div>
                        <div className="text-lg text-neutral-500 mt-2 font-medium">{data.desc}</div>
                    </div>
                    
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="bg-white border border-neutral-100 shadow-sm rounded-2xl p-5 text-center">
                            <div className="text-xs font-semibold text-neutral-400 uppercase mb-1">미세먼지 PM10</div>
                            <div className="text-2xl font-light">{data.pm10 ? Math.round(data.pm10) : '-'} <span className="text-xs text-neutral-400">µg/m³</span></div>
                        </div>
                        <div className="bg-white border border-neutral-100 shadow-sm rounded-2xl p-5 text-center">
                            <div className="text-xs font-semibold text-neutral-400 uppercase mb-1">초미세먼지 PM2.5</div>
                            <div className="text-2xl font-light">{data.pm25 ? Math.round(data.pm25) : '-'} <span className="text-xs text-neutral-400">µg/m³</span></div>
                        </div>
                        <div className="bg-white border border-neutral-100 shadow-sm rounded-2xl p-5 text-center">
                            <div className="text-xs font-semibold text-neutral-400 uppercase mb-1">습도</div>
                            <div className="text-2xl font-light">{data.humidity}%</div>
                        </div>
                        <div className="bg-white border border-neutral-100 shadow-sm rounded-2xl p-5 text-center">
                            <div className="text-xs font-semibold text-neutral-400 uppercase mb-1">풍속</div>
                            <div className="text-2xl font-light">{data.wind} <span className="text-xs text-neutral-400">km/h</span></div>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 bg-neutral-50 p-6 rounded-3xl border border-neutral-100">
                        <div className="flex flex-col items-center">
                            <i className="ph ph-sun-dim text-amber-500 text-2xl mb-1"></i>
                            <span className="text-xs text-neutral-400 font-medium">일출</span>
                            <span className="text-base font-semibold text-neutral-800 mt-1">{formatTimeStr(data.sunrise)}</span>
                        </div>
                        <div className="flex flex-col items-center">
                            <i className="ph ph-sunset text-orange-500 text-2xl mb-1"></i>
                            <span className="text-xs text-neutral-400 font-medium">일몰</span>
                            <span className="text-base font-semibold text-neutral-800 mt-1">{formatTimeStr(data.sunset)}</span>
                        </div>
                        <div className="flex flex-col items-center">
                            <i className="ph ph-moon-stars text-indigo-400 text-2xl mb-1"></i>
                            <span className="text-xs text-neutral-400 font-medium">월출</span>
                            <span className="text-base font-semibold text-neutral-800 mt-1">{formatTimeStr(data.moonrise)}</span>
                        </div>
                        <div className="flex flex-col items-center">
                            <i className="ph ph-moon text-slate-400 text-2xl mb-1"></i>
                            <span className="text-xs text-neutral-400 font-medium">월몰</span>
                            <span className="text-base font-semibold text-neutral-800 mt-1">{formatTimeStr(data.moonset)}</span>
                        </div>
                    </div>
                </div>
            )
        }

        function Calendar() {
            const [currentMonth, setCurrentMonth] = React.useState(new Date());
            const days = ['일', '월', '화', '수', '목', '금', '토'];

            const currentYear = currentMonth.getFullYear();
            const holidays = React.useMemo(() => getHolidays(currentYear), [currentYear]);

            const getDays = () => {
                const year = currentMonth.getFullYear();
                const month = currentMonth.getMonth();
                const startDay = new Date(year, month, 1).getDay();
                const endDate = new Date(year, month + 1, 0).getDate();
                const arr = Array(startDay).fill(null);
                for (let i = 1; i <= endDate; i++) arr.push(new Date(year, month, i));
                return arr;
            };

            const nav = (dir) => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + dir, 1));
            const navYear = (dir) => setCurrentMonth(new Date(currentMonth.getFullYear() + dir, currentMonth.getMonth(), 1));
            const todayStr = formatDate(new Date());

            // List of holidays in current month
            const monthHolidays = React.useMemo(() => {
                const prefix = `${currentYear}-${String(currentMonth.getMonth() + 1).padStart(2, '0')}`;
                return Object.entries(holidays)
                    .filter(([dateStr]) => dateStr.startsWith(prefix))
                    .sort(([a], [b]) => a.localeCompare(b));
            }, [holidays, currentMonth]);

            return (
                <div className="flex flex-col h-full max-w-4xl mx-auto p-4 md:p-8 overflow-y-auto hide-scrollbar">
                    <div className="flex justify-between items-center mb-6 px-2 flex-wrap gap-3">
                        <div className="flex items-center gap-3">
                            <h2 className="text-2xl font-semibold text-neutral-900">{currentYear}년 {currentMonth.getMonth() + 1}월</h2>
                            <button onClick={()=>setCurrentMonth(new Date())} className="px-3 py-1 text-xs font-medium bg-neutral-100 hover:bg-neutral-200 rounded-lg text-neutral-600 transition">
                                오늘
                            </button>
                        </div>
                        <div className="flex items-center gap-2">
                            <div className="flex bg-neutral-100 p-1 rounded-xl gap-1 text-xs font-medium text-neutral-600">
                                <button onClick={()=>navYear(-1)} className="px-2 py-1 hover:bg-white hover:shadow-sm rounded-lg transition" title="이전 해">-1년</button>
                                <button onClick={()=>navYear(1)} className="px-2 py-1 hover:bg-white hover:shadow-sm rounded-lg transition" title="다음 해">+1년</button>
                            </div>
                            <div className="flex gap-1 border-l border-neutral-200 pl-2">
                                <button onClick={()=>nav(-1)} className="p-2 hover:bg-neutral-100 rounded-full transition" title="이전 달"><i className="ph ph-caret-left text-lg"></i></button>
                                <button onClick={()=>nav(1)} className="p-2 hover:bg-neutral-100 rounded-full transition" title="다음 달"><i className="ph ph-caret-right text-lg"></i></button>
                            </div>
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-7 mb-3">
                        {days.map((d, idx) => (
                            <div key={d} className={`text-center text-xs font-semibold ${idx === 0 ? 'text-rose-500' : idx === 6 ? 'text-blue-500' : 'text-neutral-400'}`}>
                                {d}
                            </div>
                        ))}
                    </div>
                    
                    <div className="grid grid-cols-7 min-h-[360px] flex-1 auto-rows-fr gap-px bg-neutral-200 border border-neutral-200 rounded-2xl overflow-hidden shadow-sm">
                        {getDays().map((date, i) => {
                            if (!date) return <div key={i} className="bg-white"></div>;
                            const dStr = formatDate(date);
                            const isToday = dStr === todayStr;
                            const holiday = holidays[dStr];
                            const isSun = date.getDay() === 0;
                            const isSat = date.getDay() === 6;
                            
                            return (
                                <div key={i} className="bg-white p-2 flex flex-col relative transition hover:bg-neutral-50/80 min-h-[50px]">
                                    <span className={`text-sm font-medium w-7 h-7 rounded-full flex items-center justify-center
                                        ${isToday ? 'bg-black text-white font-bold' : 
                                          isSun || holiday ? 'text-rose-500' : 
                                          isSat ? 'text-blue-500' : 'text-neutral-800'}`}>
                                        {date.getDate()}
                                    </span>
                                    {holiday && <span className="text-[11px] font-semibold text-rose-500 mt-1 truncate px-1">{holiday}</span>}
                                </div>
                            )
                        })}
                    </div>

                    {/* Holiday Summary for Current Month */}
                    <div className="mt-6 p-4 rounded-2xl bg-white border border-neutral-200/80 shadow-sm">
                        <div className="text-xs font-bold text-neutral-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                            <i className="ph ph-sparkle text-amber-500"></i>
                            {currentYear}년 {currentMonth.getMonth() + 1}월 공휴일 ({monthHolidays.length}개)
                        </div>
                        {monthHolidays.length === 0 ? (
                            <div className="text-xs text-neutral-400">이번 달에는 공휴일이 없습니다.</div>
                        ) : (
                            <div className="flex flex-wrap gap-2">
                                {monthHolidays.map(([dStr, name]) => (
                                    <div key={dStr} className="inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-rose-50 text-rose-600 text-xs font-medium border border-rose-100">
                                        <span className="font-semibold">{parseInt(dStr.split('-')[2], 10)}일</span>
                                        <span>{name}</span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            )
        }

        function Memo() {
            const [memos, setMemos] = React.useState(() => JSON.parse(localStorage.getItem('min-memos') || '[]'));
            const [text, setText] = React.useState('');
            const [selectedCategory, setSelectedCategory] = React.useState('전체');

            const categories = ['전체', '일반', '업무', '개인', '아이디어'];

            React.useEffect(() => localStorage.setItem('min-memos', JSON.stringify(memos)), [memos]);

            const addMemo = (e) => {
                if(e.key === 'Enter' && !e.shiftKey && text.trim()) {
                    e.preventDefault();
                    const cat = selectedCategory === '전체' ? '일반' : selectedCategory;
                    setMemos([{ id: Date.now(), text: text.trim(), category: cat, date: new Date().toISOString() }, ...memos]);
                    setText('');
                }
            };

            const delMemo = (id) => setMemos(memos.filter(m => m.id !== id));

            const filteredMemos = selectedCategory === '전체' 
                ? memos 
                : memos.filter(m => m.category === selectedCategory);

            return (
                <div className="flex flex-col h-full max-w-4xl mx-auto p-4 md:p-8">
                    {/* Category Filter Tabs */}
                    <div className="flex gap-2 overflow-x-auto hide-scrollbar mb-6 pb-1">
                        {categories.map(cat => (
                            <button
                                key={cat}
                                onClick={() => setSelectedCategory(cat)}
                                className={`px-4 py-2 rounded-xl text-xs font-medium transition shrink-0 ${selectedCategory === cat ? 'bg-black text-white' : 'bg-neutral-100 text-neutral-600 hover:bg-neutral-200'}`}
                            >
                                {cat}
                            </button>
                        ))}
                    </div>

                    <div className="relative mb-6">
                        <textarea 
                            value={text} 
                            onChange={e=>setText(e.target.value)} 
                            onKeyDown={addMemo}
                            placeholder={`[${selectedCategory === '전체' ? '일반' : selectedCategory}] 카테고리에 메모 추가 (Enter를 누르세요)...`}
                            className="w-full bg-white border border-neutral-200 rounded-2xl p-4 text-neutral-800 resize-none focus:outline-none focus:ring-2 focus:ring-black transition text-sm shadow-sm"
                            rows="3"
                        ></textarea>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto hide-scrollbar space-y-3">
                        {filteredMemos.length === 0 ? (
                            <div className="text-center text-neutral-400 py-12 text-sm">작성된 메모가 없습니다.</div>
                        ) : null}
                        {filteredMemos.map(m => (
                            <div key={m.id} className="group p-5 border border-neutral-200/80 rounded-2xl hover:border-neutral-300 transition relative bg-white shadow-sm flex flex-col justify-between">
                                <div>
                                    <span className="inline-block px-2.5 py-0.5 rounded-md bg-neutral-100 text-[11px] font-semibold text-neutral-600 mb-2">
                                        {m.category || '일반'}
                                    </span>
                                    <p className="text-neutral-800 whitespace-pre-wrap text-sm leading-relaxed pr-8">{m.text}</p>
                                </div>
                                <div className="flex justify-between items-center mt-4 pt-3 border-t border-neutral-100 text-xs text-neutral-400">
                                    <span>{new Date(m.date).toLocaleString('ko-KR', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
                                    <button onClick={()=>delMemo(m.id)} className="text-neutral-300 hover:text-rose-500 transition p-1">
                                        <i className="ph ph-trash text-base"></i>
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            )
        }

        function WorldClock({ showSeconds, setToast }) {
            const [time, setTime] = React.useState(new Date());
            const [searchQuery, setSearchQuery] = React.useState('');
            const [favorites, setFavorites] = React.useState(() => {
                const saved = localStorage.getItem('min-worldclock-favs');
                return saved !== null ? JSON.parse(saved) : [];
            });

            React.useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            React.useEffect(() => {
                localStorage.setItem('min-worldclock-favs', JSON.stringify(favorites));
            }, [favorites]);

            const toggleFavorite = (cityId) => {
                setFavorites(prev => {
                    if (prev.includes(cityId)) {
                        setToast('즐겨찾기에서 삭제되었습니다.');
                        return prev.filter(id => id !== cityId);
                    } else {
                        if (prev.length >= 10) {
                            setToast('즐겨찾기는 최대 10개까지 저장 가능합니다.');
                            return prev;
                        }
                        setToast('즐겨찾기에 추가되었습니다.');
                        return [...prev, cityId];
                    }
                });
            };

            const formatCityTime = (tz) => {
                try {
                    const options = {
                        timeZone: tz,
                        hour12: false,
                        hour: '2-digit',
                        minute: '2-digit'
                    };
                    if (showSeconds) {
                        options.second = '2-digit';
                    }
                    return new Intl.DateTimeFormat('en-GB', options).format(time);
                } catch (e) {
                    return '--:--';
                }
            };

            const getTimeOffset = (tz) => {
                try {
                    const now = new Date();
                    const localOffset = -now.getTimezoneOffset();
                    
                    const cityDate = new Date(now.toLocaleString('en-US', { timeZone: tz }));
                    const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
                    const cityOffset = (cityDate - utcDate) / 60000;
                    
                    const diffHours = (cityOffset - localOffset) / 60;
                    if (diffHours === 0) return '현지와 동일';
                    return diffHours > 0 ? `현지보다 +${diffHours}시간` : `현지보다 ${diffHours}시간`;
                } catch(e) {
                    return '';
                }
            };

            const filteredCities = ALL_CITIES.filter(c => 
                c.name.includes(searchQuery) || 
                c.country.includes(searchQuery) || 
                c.id.includes(searchQuery.toLowerCase())
            );

            const favoriteCityObjects = ALL_CITIES.filter(c => favorites.includes(c.id));

            return (
                <div className="flex flex-col h-full max-w-4xl mx-auto p-4 md:p-8 overflow-y-auto hide-scrollbar">
                    {/* Search Bar */}
                    <div className="relative mb-6">
                        <i className="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-neutral-400 text-xl"></i>
                        <input 
                            type="text" 
                            value={searchQuery}
                            onChange={e => setSearchQuery(e.target.value)}
                            placeholder="도시명 또는 국가 검색 (예: 서울, 뉴욕, 파리, 일본)..." 
                            className="w-full bg-white border border-neutral-200 shadow-sm rounded-2xl py-3.5 pl-12 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-black transition"
                        />
                        {searchQuery && (
                            <button onClick={()=>setSearchQuery('')} className="absolute right-4 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-black">
                                <i className="ph ph-x text-lg"></i>
                            </button>
                        )}
                    </div>

                    {/* Search Results */}
                    {searchQuery ? (
                        <div className="space-y-3 mb-8">
                            <h3 className="text-xs font-semibold text-neutral-400 uppercase tracking-wider px-1">검색 결과 ({filteredCities.length})</h3>
                            {filteredCities.length === 0 ? (
                                <div className="text-center text-neutral-400 py-10 bg-white rounded-2xl border border-neutral-100 text-sm">
                                    검색 결과가 없습니다.
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    {filteredCities.map(city => {
                                        const isFav = favorites.includes(city.id);
                                        return (
                                            <div key={city.id} className="flex justify-between items-center p-4 rounded-2xl border border-neutral-200/80 bg-white hover:border-neutral-300 transition shadow-sm">
                                                <div>
                                                    <div className="font-semibold text-base text-neutral-900">{city.name}</div>
                                                    <div className="text-xs text-neutral-400 mt-0.5">{city.country} · {getTimeOffset(city.tz)}</div>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <span className="text-lg font-mono font-medium tabular-nums text-neutral-800">{formatCityTime(city.tz)}</span>
                                                    <button 
                                                        onClick={() => toggleFavorite(city.id)}
                                                        className={`p-2 rounded-xl transition ${isFav ? 'text-amber-500 bg-amber-50 hover:bg-amber-100' : 'text-neutral-300 hover:text-neutral-600 bg-neutral-50 hover:bg-neutral-100'}`}
                                                    >
                                                        <i className={`ph-fill ${isFav ? 'ph-star text-xl' : 'ph-star text-xl'}`}></i>
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    ) : null}

                    {/* Favorites Section */}
                    <div>
                        <div className="flex justify-between items-center mb-4 px-1">
                            <h3 className="text-sm font-bold text-neutral-900 flex items-center gap-2">
                                <i className="ph-fill ph-star text-amber-500 text-lg"></i>
                                즐겨찾는 세계 시계 ({favorites.length}/10)
                            </h3>
                        </div>

                        {favoriteCityObjects.length === 0 ? (
                            <div className="flex flex-col items-center justify-center p-12 bg-white rounded-3xl border border-neutral-200/70 shadow-sm text-center">
                                <div className="w-16 h-16 rounded-full bg-neutral-100 flex items-center justify-center text-neutral-400 mb-4">
                                    <i className="ph ph-globe-hemisphere-west text-3xl"></i>
                                </div>
                                <p className="text-neutral-800 font-semibold mb-1">등록된 즐겨찾기가 없습니다</p>
                                <p className="text-xs text-neutral-400 max-w-xs">상단 검색창에 도시 이름을 검색한 후 별 모양 버튼을 눌러 목록에 추가해보세요.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {favoriteCityObjects.map(city => (
                                    <div key={city.id} className="flex justify-between items-center p-5 rounded-3xl border border-neutral-200/80 bg-white shadow-sm hover:shadow-md transition">
                                        <div>
                                            <div className="font-bold text-lg text-neutral-900">{city.name}</div>
                                            <div className="text-xs font-medium text-neutral-400 mt-1">{city.country} · <span className="text-neutral-500">{getTimeOffset(city.tz)}</span></div>
                                        </div>
                                        <div className="flex items-center gap-4">
                                            <span className="text-2xl font-light tabular-nums text-neutral-900 tracking-tight">{formatCityTime(city.tz)}</span>
                                            <button 
                                                onClick={() => toggleFavorite(city.id)}
                                                className="text-amber-500 hover:text-rose-500 p-2 rounded-xl hover:bg-rose-50 transition"
                                                title="즐겨찾기 삭제"
                                            >
                                                <i className="ph-fill ph-star text-xl"></i>
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            )
        }

        function Search() {
            const [query, setQuery] = React.useState("");
            const submit = (e) => {
                e.preventDefault();
                if(query.trim()) window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, "_blank");
            };
            return (
                <div className="flex h-full items-center justify-center p-6">
                    <form onSubmit={submit} className="w-full max-w-xl relative">
                        <i className="ph ph-magnifying-glass absolute left-6 top-1/2 -translate-y-1/2 text-neutral-400 text-2xl"></i>
                        <input 
                            type="text" 
                            value={query} 
                            onChange={e=>setQuery(e.target.value)}
                            placeholder="구글에서 검색..."
                            className="w-full bg-white border border-neutral-200 shadow-lg shadow-neutral-100 rounded-full py-5 pl-16 pr-6 text-lg focus:outline-none focus:ring-2 focus:ring-black transition" 
                            autoFocus 
                        />
                    </form>
                </div>
            )
        }

        function App() {
            const [activeTab, setActiveTab] = React.useState('clock');
            const [isSidebarCollapsed, setIsSidebarCollapsed] = React.useState(false);
            const [showSeconds, setShowSeconds] = React.useState(() => {
                return localStorage.getItem('min-show-seconds') === 'true';
            });
            const [isSettingsOpen, setIsSettingsOpen] = React.useState(false);
            const [toastMessage, setToastMessage] = React.useState('');

            const setToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const toggleSeconds = () => {
                const nextVal = !showSeconds;
                setShowSeconds(nextVal);
                localStorage.setItem('min-show-seconds', nextVal.toString());
            };

            const Content = () => {
                switch(activeTab) {
                    case 'clock': return <LocalClock showSeconds={showSeconds} />;
                    case 'worldclock': return <WorldClock showSeconds={showSeconds} setToast={setToast} />;
                    case 'calculator': return <Calculator />;
                    case 'timer': return <Timer showSeconds={showSeconds} />;
                    case 'weather': return <Weather showSeconds={showSeconds} />;
                    case 'calendar': return <Calendar />;
                    case 'memo': return <Memo />;
                    case 'search': return <Search />;
                    default: return null;
                }
            };

            return (
                <div className="flex flex-col md:flex-row h-screen w-screen bg-neutral-50 overflow-hidden">
                    {/* Toast Alert */}
                    {toastMessage && (
                        <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-neutral-900 text-white px-5 py-2.5 rounded-full text-xs font-medium shadow-xl animate-bounce flex items-center gap-2">
                            <i className="ph ph-info text-base text-amber-400"></i>
                            {toastMessage}
                        </div>
                    )}

                    {/* Navigation Sidebar */}
                    <nav className={`sidebar-transition border-b md:border-b-0 md:border-r border-neutral-200/80 bg-white shrink-0 flex flex-row md:flex-col justify-between p-2 md:p-4 z-20 sticky top-0 md:static
                        ${isSidebarCollapsed ? 'md:w-20' : 'md:w-64'}`}>
                        
                        <div className="flex flex-row md:flex-col gap-2 w-full">
                            {/* App Header & Collapse Toggle Button */}
                            <div className="hidden md:flex items-center justify-between mb-6 px-2">
                                {!isSidebarCollapsed && <span className="text-lg font-bold tracking-tight text-neutral-900">Multi Tools</span>}
                                <button 
                                    onClick={() => setIsSidebarCollapsed(!isSidebarCollapsed)} 
                                    className="p-2 rounded-xl text-neutral-400 hover:text-black hover:bg-neutral-100 transition ml-auto"
                                    title={isSidebarCollapsed ? "사이드바 펼치기" : "사이드바 접기"}
                                >
                                    <i className={`ph ${isSidebarCollapsed ? 'ph-sidebar-simple' : 'ph-sidebar-simple'} text-xl`}></i>
                                </button>
                            </div>

                            {/* Tool Navigation Items */}
                            <div className="flex flex-row md:flex-col gap-1 overflow-x-auto md:overflow-y-auto hide-scrollbar w-full">
                                {TOOLS.map(tool => {
                                    const isActive = activeTab === tool.id;
                                    return (
                                        <button 
                                            key={tool.id} 
                                            onClick={() => setActiveTab(tool.id)}
                                            className={`flex items-center gap-3.5 p-3 rounded-xl transition shrink-0 w-full
                                                ${isActive ? 'bg-neutral-900 text-white font-medium shadow-sm' : 'text-neutral-500 hover:bg-neutral-100 hover:text-black'}`}
                                            title={tool.name}
                                        >
                                            <i className={`ph ${tool.icon} text-xl shrink-0`}></i>
                                            {!isSidebarCollapsed && (
                                                <span className="text-sm hidden md:inline truncate">{tool.name}</span>
                                            )}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Mobile Collapse toggle or info */}
                        <div className="hidden md:block border-t border-neutral-100 pt-3">
                            <button 
                                onClick={() => setIsSettingsOpen(true)}
                                className="flex items-center gap-3.5 p-3 rounded-xl text-neutral-500 hover:bg-neutral-100 hover:text-black transition w-full"
                            >
                                <i className="ph ph-gear text-xl"></i>
                                {!isSidebarCollapsed && <span className="text-sm">설정</span>}
                            </button>
                        </div>
                    </nav>

                    {/* Main Content Area */}
                    <main className="flex-1 relative overflow-hidden bg-neutral-50 flex flex-col">
                        {/* Top Bar for Mobile & Quick Settings */}
                        <header className="h-14 px-6 border-b border-neutral-200/60 bg-white/70 backdrop-blur-md flex items-center justify-between shrink-0">
                            <div className="font-semibold text-neutral-800 text-sm">
                                {TOOLS.find(t => t.id === activeTab)?.name}
                            </div>
                            
                            <div className="flex items-center gap-2">
                                <button 
                                    onClick={() => setIsSettingsOpen(true)}
                                    className="p-2 rounded-xl text-neutral-500 hover:text-black hover:bg-neutral-100 transition"
                                    title="설정"
                                >
                                    <i className="ph ph-gear text-xl"></i>
                                </button>
                            </div>
                        </header>

                        {/* Main View Area */}
                        <div className="flex-1 relative overflow-hidden">
                            <Content />
                        </div>
                    </main>

                    {/* Settings Modal */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-6">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-lg font-bold text-neutral-900">설정</h3>
                                    <button onClick={() => setIsSettingsOpen(false)} className="p-1 text-neutral-400 hover:text-black">
                                        <i className="ph ph-x text-xl"></i>
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    <div className="flex items-center justify-between p-3.5 bg-neutral-50 rounded-2xl">
                                        <div>
                                            <div className="text-sm font-semibold text-neutral-800">초 표시</div>
                                            <div className="text-xs text-neutral-400">시계 및 타이머에서 초 단위 표시</div>
                                        </div>
                                        <button 
                                            onClick={toggleSeconds}
                                            className={`w-12 h-6 rounded-full transition-colors relative p-0.5 ${showSeconds ? 'bg-black' : 'bg-neutral-300'}`}
                                        >
                                            <div className={`w-5 h-5 bg-white rounded-full shadow-md transition-transform ${showSeconds ? 'translate-x-6' : 'translate-x-0'}`}></div>
                                        </button>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setIsSettingsOpen(false)}
                                    className="w-full py-3 bg-neutral-900 text-white font-semibold text-sm rounded-xl hover:bg-black transition"
                                >
                                    확인
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
